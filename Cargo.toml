[package]
name = "dblite"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
csv = "1"
dirs = { version = "7.0.0", default-features = false }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui-phosphor = "0.14.0"
egui_extras = { version = "0.36.2", default-features = false }
getrandom = "0.3"
mysql = { version = "28.0.3", default-features = false, features = ["minimal", "rustls-tls-ring"] }
postgres = { version = "0.19.14", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlformat = "0.5.0"
thiserror = "2.0.21"
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"] }
webpki-roots = { version = "1.0.9", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu", "eframe"] }
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }


[features]
# Preloads and auto-connects a local "dev" PostgreSQL connection (postgres/postgres@localhost:5432).
dev-conn = []

[build-dependencies]
winresource = "0.1"
