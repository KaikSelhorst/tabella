[package]
name = "tabella"
version = "0.2.0"
edition = "2024"
authors = ["Kaik Selhorst"]

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
calamine = { version = "0.37.0", default-features = false }
chacha20poly1305 = "0.11.0"
csv = "1"
dirs = { version = "7.0.0", default-features = false }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui-phosphor = "0.14.0"
egui_extras = { version = "0.36.2", default-features = false }
fallible-iterator = "0.3"
getrandom = "0.3"
mysql = { version = "28.0.3", default-features = false, features = ["minimal", "rustls-tls-ring"] }
postgres = { version = "0.19.14", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
rust_xlsxwriter = "0.101.0"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlformat = "0.5.0"
thiserror = "2.0.21"
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"] }
webpki-roots = { version = "1.0.9", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu", "eframe"] }
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
zip = { version = "9", default-features = false, features = ["deflate"] }


[features]
# Preloads and auto-connects a local "dev" PostgreSQL connection (postgres/postgres@localhost:5432).
dev-conn = []

[build-dependencies]
winresource = "0.1"

# Installers for releases: `cargo packager --release` after a release build (AppImage and .deb on
# Linux, NSIS on Windows via `--formats nsis`).
[package.metadata.packager]
product-name = "tabella"
identifier = "dev.tabella.app"
description = "Lightweight client for PostgreSQL, MySQL and SQLite"
category = "DeveloperTool"
icons = ["assets/icon.png", "assets/icon.ico"]
out-dir = "target/packages"
formats = ["appimage", "deb"]

# What a desktop session already has: the window toolkit loads these at runtime.
[package.metadata.packager.deb]
depends = ["libc6", "libgl1", "libegl1", "libxkbcommon-x11-0", "libxcursor1", "libxrandr2", "libxi6"]

# Installs for the current user only, so it needs no administrator rights.
[package.metadata.packager.nsis]
installer-mode = "currentUser"
