# Databases for dblite.
#
#   docker compose --profile test up -d --wait   # what `cargo test -- --ignored` expects
#   docker compose --profile dev up -d --wait    # heavy sample data (millions of rows; ~3 min to seed)
#
# Test databases are throwaway (no volumes). Dev data is re-seeded on first start of a fresh
# container; `docker compose --profile dev down` resets it.

services:
  test-pg:
    profiles: [test]
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: pw }
    ports: ["55432:5432"]
    # For the "consultas lentas" view.
    command: ["-c", "shared_preload_libraries=pg_stat_statements"]
    healthcheck: &pg-health
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  test-mysql:
    profiles: [test]
    image: mysql:8
    environment: { MYSQL_ROOT_PASSWORD: pw, MYSQL_DATABASE: test }
    ports: ["53306:3306"]
    healthcheck: &mysql-health
      # Ping over TCP: the server listens on the socket during init, before it is really ready.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 2s
      retries: 60

  # TLS-enabled Postgres with the image's self-signed "snakeoil" certificate (Debian image).
  test-pg-tls:
    profiles: [test]
    image: postgres:16
    environment: { POSTGRES_PASSWORD: pw }
    ports: ["55433:5432"]
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      - -c
      - ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    healthcheck: *pg-health

  # SSH server for the tunnel test: reaches test-pg over the compose network (test-pg:5432).
  test-ssh:
    profiles: [test]
    image: alpine:3.20
    ports: ["52222:22"]
    volumes: ["./dev/ssh/test_key.pub:/tmp/key.pub:ro"]
    command:
      - sh
      - -c
      - >-
        apk add --no-cache openssh-server >/dev/null &&
        ssh-keygen -A &&
        adduser -D -s /bin/sh tunnel &&
        sed -i 's/^tunnel:!/tunnel:*/' /etc/shadow &&
        install -d -m 700 -o tunnel /home/tunnel/.ssh &&
        install -m 600 -o tunnel /tmp/key.pub /home/tunnel/.ssh/authorized_keys &&
        exec /usr/sbin/sshd -D -e -o AllowTcpForwarding=yes -o PasswordAuthentication=no
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 2s
      retries: 60

  dev-pg:
    profiles: [dev]
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    command: ["-c", "shared_preload_libraries=pg_stat_statements"]
    volumes: ["./dev/postgres.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    # Over TCP: during the ~3 min seed the server only listens on its socket, so this
    # reports healthy once the data is really there.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 3s
      retries: 120

  dev-mysql:
    profiles: [dev]
    image: mysql:8
    environment: { MYSQL_ROOT_PASSWORD: mysql, MYSQL_DATABASE: loja }
    ports: ["3307:3306"]
    volumes: ["./dev/mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      <<: *mysql-health
      interval: 3s
      retries: 120 # the seed takes a few minutes
